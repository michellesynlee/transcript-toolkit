# Advanced settings for the Ask page. You normally don't touch these. The summary's model and
# how much it thinks can also be set under `ask:` in config.yaml.

# "Who talks about ...": a topic or place belongs to a whole clip, so a speaker is credited with
# it only when at least this share of the clip's words are theirs. Stops an interviewer's long
# question, answered with "yes", counting as the narrator talking about it (and the reverse).
speaker_min_share: 0.25

# --- the AI summary (`toolkit ask summarize`) ---

model: gpt-5.6-luna
reasoning: low
verbosity: low
prompt: ask_summary.md            # in prompts/
max_clips: 40                     # the clearest this many are read; the summary says if there were more
# What the estimate on the button assumes the answer will cost in output tokens, until this
# project has made a summary call to measure it by.
expected_output_tokens: 800
poll_interval_s: 4
max_total_wait_s: 300
