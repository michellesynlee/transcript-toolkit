# Advanced settings for the Ask page's AI summary (`toolkit ask summarize`). You normally don't
# touch these. The model and how much it thinks can also be set under `ask:` in config.yaml.

model: gpt-5.6-luna
reasoning: low
verbosity: low
prompt: ask_summary.md            # in prompts/
max_clips: 40                     # the clearest this many are read; the summary says if there were more
# What the estimate on the button assumes the answer will cost in output tokens, until this
# project has made a summary call to measure it by.
expected_output_tokens: 800
poll_interval_s: 4
max_total_wait_s: 300
